<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />

    <link rel="stylesheet" href="styles.css?v=20260610-recent-updates-1" />

  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html#home" aria-label="软件部 AI 应用中心首页">
          <img src="assets/companylogo.png" alt="公司 Logo" />
          <span>软件部 AI 应用中心</span>
        </a>
        <nav class="main-nav" aria-label="主导航">
          <a href="index.html#home">首页</a>
          <a href="platform.html">智能体应用</a>
          <a href="tools.html">提效工具库</a>
          <a href="skills.html">Skills 库</a>
          <a href="index.html#request">需求对接</a>
        </nav>
      </div>

    <main class="skillhub-page">
      <section class="skillhub-hero">
        <div class="container">
          <div class="skillhub-search-row">
            <div class="skillhub-search">
              <span aria-hidden="true"></span>
              <input id="skillsSearch" type="search" placeholder="搜索 Skill 名称、描述" aria-label="搜索 Skills" />
            </div>
            <a class="skillhub-explore" href="#skillsGrid">探索全部技能</a>
          </div>
        </div>
      </section>

      <section class="skillhub-directory">
        <div class="container">
          <div class="skillhub-tabs" id="skillsFilters" aria-label="Skills 分类"></div>

          <div class="skillhub-section-head">
            <h1>Skills 库</h1>
          </div>

          <div class="skill-market-grid" id="skillsGrid"></div>
          <div class="empty-state" id="skillsEmpty">没有找到匹配的 Skill，请调整筛选条件。</div>
          <nav class="skill-pagination" id="skillsPagination" aria-label="Skills 分页"></nav>
        </div>
      </section>

    <footer class="site-footer">

        <span>软件部 AI 应用中心</span>
