interface:
  display_name: sop writer
  short_description: '【SOP】{事务名称}操作手册

    1. 总体说明

    1.1 目的

    1.2 适用范围

    1.3 编制原则

    2. 单项事务手册核心内容结构

    2.1 事项说明        ← 背景、触发条件、目标结果、完成判定标准

    2.2 具体流程        ← 主流程，按阶段逐步描述

    2.3 关键控制点      ← 必须做 / 禁止做，仅保留高风险节点

    2.4 效率方案        ← 推荐做法、可复用资源

    2.5 易错经验与风险提示 ← 表格形式

    3. 成果与验收要求   ← 产出物清单 + 完成判定标准

    4. 应用与维护

    4.1 使用场景

    4.2 更新机制'
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
